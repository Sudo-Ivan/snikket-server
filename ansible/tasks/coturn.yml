---

- name: "Install coturn runtime libraries"
  apt:
    name:
      - libevent-core-2.1-7t64
      - libevent-extra-2.1-7t64
      - libevent-openssl-2.1-7t64
      - libevent-pthreads-2.1-7t64
      - libsqlite3-0
      - libssl3t64
    state: present
    install_recommends: no

- name: "Create turnserver group"
  group:
    name: turnserver
    gid: 65532
- name: "Create turnserver user"
  user:
    name: turnserver
    group: turnserver
    system: yes
    home: /
    create_home: no
    shell: /usr/sbin/nologin

- name: Configure coturn
  copy:
    src: ../files/turnserver.conf
    dest: /etc/turnserver.conf
    owner: root
    group: root
    mode: 0644
