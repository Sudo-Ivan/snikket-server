name: portal-tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - "web-portal/**"
      - ".github/workflows/portal-tests.yml"
  pull_request:
    paths:
      - "web-portal/**"
      - ".github/workflows/portal-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    name: "typecheck: mypy"
    defaults:
      run:
        working-directory: web-portal
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r build-requirements.lock
      - name: Typecheck
        run: |
          python -m mypy --config mypy.ini -p snikket_web

  linting:
    runs-on: ubuntu-latest
    name: "lint: flake8"
    defaults:
      run:
        working-directory: web-portal
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          set -euo pipefail
          pip install --require-hashes -r build-requirements.lock
      - name: Linting
        run: |
          make flake8
