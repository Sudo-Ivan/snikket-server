name: images

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: .
            image: snikket-server
          - component: web-proxy
            context: web-proxy
            image: snikket-web-proxy
          - component: cert-manager
            context: cert-manager
            image: snikket-cert-manager
          - component: web-portal
            context: web-portal
            image: snikket-web-portal

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sudo-ivan/${{ matrix.image }}
          tags: |
            type=edge,branch=master
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push (zstd-compressed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # compression/force-compression are exporter attrs in build-push-action v7,
          # so they must be passed via outputs rather than dedicated inputs
          outputs: ${{ github.event_name != 'pull_request' && 'type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true' || 'type=cacheonly' }}
          pull: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            BUILD_SERIES=${{ github.ref_name }}
            BUILD_ID=${{ github.run_number }}
