# Works with both `docker compose` and `podman compose` (or podman-compose).
# Prebuilt images are published to ghcr.io/sudo-ivan/; the build: contexts
# let you build locally instead (e.g. `podman compose build`).
services:
  snikket_proxy:
    container_name: snikket-proxy
    image: ghcr.io/sudo-ivan/snikket-web-proxy:edge
    build: ./web-proxy
    env_file: snikket.conf
    network_mode: host
    volumes:
      - snikket_data:/snikket
      - acme_challenges:/var/www/html/.well-known/acme-challenge
    restart: "unless-stopped"
  snikket_certs:
    container_name: snikket-certs
    image: ghcr.io/sudo-ivan/snikket-cert-manager:edge
    build: ./cert-manager
    network_mode: host
    env_file: snikket.conf
    volumes:
      - snikket_data:/snikket
      - acme_challenges:/var/www/.well-known/acme-challenge
    restart: "unless-stopped"
  snikket_portal:
    container_name: snikket-portal
    image: ghcr.io/sudo-ivan/snikket-web-portal:edge
    build: ./web-portal
    network_mode: host
    env_file: snikket.conf
    restart: "unless-stopped"

  snikket_server:
    container_name: snikket
    image: ghcr.io/sudo-ivan/snikket-server:edge
    build: .
    network_mode: host
    volumes:
      - snikket_data:/snikket
    env_file: snikket.conf
    restart: "unless-stopped"

volumes:
  acme_challenges:
  snikket_data:
