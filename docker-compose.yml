# Compatible with Docker Compose and Podman Compose.
# Prebuilt images are published to ghcr.io/sudo-ivan.
# Build contexts allow local builds with podman compose build.
# Rootless host networking needs the host's unprivileged-port threshold at 80 or lower.
services:
  snikket_proxy:
    container_name: snikket-proxy
    image: ghcr.io/sudo-ivan/snikket-web-proxy:edge
    build: ./web-proxy
    env_file: snikket.conf
    network_mode: host
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - snikket_data:/snikket:ro
      - acme_challenges:/var/www/html/.well-known/acme-challenge:ro
    restart: "unless-stopped"
  snikket_certs:
    container_name: snikket-certs
    image: ghcr.io/sudo-ivan/snikket-cert-manager:edge
    build: ./cert-manager
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    env_file: snikket.conf
    volumes:
      - snikket_data:/snikket
      - acme_challenges:/var/www/.well-known/acme-challenge
    restart: "unless-stopped"
  snikket_portal:
    container_name: snikket-portal
    image: ghcr.io/sudo-ivan/snikket-web-portal:edge
    build: ./web-portal
    network_mode: host
    env_file: snikket.conf
    restart: "unless-stopped"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - portal_data:/snikket
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  snikket_server:
    container_name: snikket
    image: ghcr.io/sudo-ivan/snikket-server:edge
    build: .
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - snikket_data:/snikket
    env_file: snikket.conf
    restart: "unless-stopped"

volumes:
  acme_challenges:
  portal_data:
  snikket_data:
